<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
    }
    h3 { margin: 0 0 6px; font-size: 14px; }
    p { margin: 0 0 12px; font-size: 12px; color: #475569; line-height: 1.4; }
    button {
      width: 100%;
      padding: 9px 12px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 12.5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 8px; font-size: 11px; color: #059669; }
  </style>
</head>
<body>
  <h3>TabFlow Live Chrome Bridge</h3>
  <p>Sync your actual Chrome Tab Groups &amp; Ungrouped Tabs across windows with TabFlow.</p>
  <button id="btnSyncOpen">🔄 Sync Tabs &amp; Open TabFlow</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
